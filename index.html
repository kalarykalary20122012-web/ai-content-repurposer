<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Repurposer | Pro Edition 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between">
    <div class="max-w-4xl mx-auto px-4 py-8 w-full">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-black bg-gradient-to-r from-orange-500 to-amber-400 bg-clip-text text-transparent">
                🚀 AI Repurposer <span class="text-xs bg-orange-500/20 text-orange-400 px-2 py-1 rounded-full border border-orange-500/30">PRO 2026</span>
            </h1>
            <span class="text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">● System Online</span>
        </header>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl mb-8">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Enter Your Topic / Video Idea:</label>
                    <input type="text" id="topicInput" placeholder="e.g., Artificial Intelligence in 2026..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition">
                </div>
                <button onclick="generateContent()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-orange-500/20 cursor-pointer">
                    ✨ Generate Pro Viral Content
                </button>
            </div>
        </div>

        <div id="resultsArea" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
            <h2 class="text-lg font-bold text-orange-400 border-b border-slate-800 pb-2">Generated Results:</h2>
            <div class="space-y-4">
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">🐦 Twitter / X Thread</h3>
                    <p id="twitterResult" class="text-slate-200 whitespace-pre-line"></p>
                </div>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">🎬 TikTok / Reels Script</h3>
                    <p id="tiktokResult" class="text-slate-200 whitespace-pre-line"></p>
                </div>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">💼 LinkedIn Professional Post</h3>
                    <p id="linkedinResult" class="text-slate-200 whitespace-pre-line"></p>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-6 border-t border-slate-900 text-slate-500 text-xs">
        &copy; 2026 Youssef Jalal Sleman. All rights reserved. Professional AI Suite.
    </footer>

    <script>
        function generateContent() {
            const topic = document.getElementById('topicInput').value.trim();
            if(!topic) {
                alert("تکایە سەرەتا بابەتێک بنووسە!");
                return;
            }

            document.getElementById('twitterResult').innerText = `🔥 ${topic} is changing everything right now!\n\nHere are 3 things you must know in 2026:\n1. Massive shift in tech.\n2. Creator economy growth.\n3. Endless opportunities.\n\n#AI #Tech #${topic.replace(/\s+/g, '')}`;
            
            document.getElementById('tiktokResult').innerText = `[0-3s Hook]: Stop scrolling if you want to understand ${topic}!\n\n[Body]: Nobody is talking about this hidden secret...\n\n[CTA]: Save this video and follow for daily updates!`;
            
            document.getElementById('linkedinResult').innerText = `The landscape of ${topic} is evolving faster than ever.\n\nAs professionals, adapting to these innovations is no longer optional—it's essential.\n\nWhat is your strategy for this year? Let's discuss below. 💡`;

            document.getElementById('resultsArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
